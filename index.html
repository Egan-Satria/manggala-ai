<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manggala AI — Asisten Operasional Kos Manggala House</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-hover: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --blue: #38bdf8;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text); line-height: 1.6;
      background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 50%);
    }
    .container { max-width: 1020px; margin: 0 auto; padding: 0 20px; }
    section { padding: 44px 0; }
    h2 { font-size: 1.75rem; text-align: center; margin-bottom: 10px; letter-spacing: -0.02em; }
    .sub { text-align: center; color: var(--muted); margin-bottom: 34px; font-size: 0.98rem; }

    /* 1. HERO SECTION */
    .hero { text-align: center; padding: 64px 0 32px; }
    .avatar {
      width: 76px; height: 76px; margin: 0 auto 20px;
      border-radius: 22px; background: linear-gradient(135deg, #10b981, #0284c7);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; box-shadow: 0 10px 30px var(--accent-glow);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399; padding: 6px 16px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600; margin-bottom: 20px;
      box-shadow: 0 0 20px var(--accent-glow); animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.15); }
      50% { box-shadow: 0 0 24px rgba(16, 185, 129, 0.4); }
    }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); letter-spacing: -0.03em; margin-bottom: 14px; }
    .hero p { font-size: 1.15rem; color: var(--muted); max-width: 680px; margin: 0 auto; }
